name: Android CI (APK Build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./JangjakPOS_source_Final

    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create missing properties
      run: |
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.nonTransitiveRClass=true" >> gradle.properties

    # 버전에 맞는 Gradle(8.3)을 강제로 지정하여 설치
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.3'

    # Wrapper 대신 설치된 시스템 Gradle로 직접 빌드
    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Rename APK file
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/JangjakPOS.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JangjakPOS-debug-apk
        path: JangjakPOS_source_Final/app/build/outputs/apk/debug/JangjakPOS.apk
