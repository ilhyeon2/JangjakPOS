name: Android Build

on:
  push:
    branches: [ "main" ]

# 1. 여기에 전체 환경 변수로 메모리 설정을 강제 주입합니다.
env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
  JAVA_TOOL_OPTIONS: "-Xmx4096m"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 2. 빌드 명령어 뒤에 --no-daemon을 추가하여 백그라운드 프로세스 메모리 낭비를 막습니다.
    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon
