name: Android CI (APK Build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 1. 누락된 안드로이드 필수 설정 파일(gradle.properties) 자동 생성
    - name: Create missing Gradle files
      run: |
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.nonTransitiveRClass=true" >> gradle.properties
        gradle wrapper --gradle-version 8.3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 2. 생성된 gradlew 파일에 실행 권한 부여
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 3. 디버그 APK 빌드 실행
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 4. 파일명 변경
    - name: Rename APK file
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/JangjakPOS.apk

    # 5. 아티팩트 업로드
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JangjakPOS-debug-apk
        path: app/build/outputs/apk/debug/JangjakPOS.apk
