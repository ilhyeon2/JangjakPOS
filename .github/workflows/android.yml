name: Android CI (APK Build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # Gradle 실행 권한 부여 추가
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    # Gradle Wrapper 사용하여 디버그 빌드
    - name: Build Debug APK
      run: ./gradlew assembleDebug || gradle assembleDebug

    - name: Rename APK file
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/JangjakPOS.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JangjakPOS-debug-apk
        path: app/build/outputs/apk/debug/JangjakPOS.apk
