name: Android CI (APK Build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # 모든 빌드 명령을 해당 하위 폴더 안에서 실행하도록 지정
    defaults:
      run:
        working-directory: ./JangjakPOS_source_Final

    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create missing Gradle files
      run: |
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.nonTransitiveRClass=true" >> gradle.properties
        gradle wrapper --gradle-version 8.3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Rename APK file
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/JangjakPOS.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JangjakPOS-debug-apk
        # 다운로드할 파일 경로에도 폴더명을 추가하여 정확히 지정
        path: JangjakPOS_source_Final/app/build/outputs/apk/debug/JangjakPOS.apk
