name: Android Build

on:
  push:
    branches: [ "main", "master", "ilhyeon2-A17" ]
  pull_request:
    branches: [ "main", "master", "ilhyeon2-A17" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 불러오기 (Checkout)
      uses: actions/checkout@v4

    - name: JDK 17 설정 (setup-java v5 적용)
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Gradle 환경 설정 및 캐시 (최신 버전 적용)
      uses: gradle/actions/setup-gradle@v4

    - name: 누락된 Gradle Wrapper 강제 생성
      working-directory: ./JangjakPOS_source_Final
      run: gradle wrapper

    - name: gradlew 실행 권한 부여
      working-directory: ./JangjakPOS_source_Final
      run: chmod +x gradlew

    - name: 안드로이드 디버그 APK 빌드
      working-directory: ./JangjakPOS_source_Final
      run: ./gradlew assembleDebug

    - name: 빌드 결과물(APK) 업로드 (upload-artifact v4)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: JangjakPOS_source_Final/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
